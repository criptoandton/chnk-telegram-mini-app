<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/jpeg" href="./images/favicon.jpg" />
    <meta name="theme-color" content="#0a0d14" />
    <title>CHNK — Telegram Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta property="og:image" content="./images/favicon.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <script>
      /* Apply the saved theme before first paint to avoid a flash of the wrong colours. */
      (function () {
        try {
          var s = localStorage.getItem('chnk_theme');
          var d = (s === 'dark' || s === 'light') ? s : 'dark';
          document.documentElement.setAttribute('data-theme', d);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', d === 'dark' ? '#0a0d14' : '#f2f6fc');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
