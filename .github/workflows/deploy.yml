name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://htwrjzlrewrxeartslhi.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_BEQbpUhu9Sw6akvVEb5CJQ_SRdmXi1a
      VITE_TG_CHANNEL: https://t.me/CHNK_channel
      VITE_TG_BANK: https://t.me/Chnkbank
      VITE_TG_SUPPORT: https://t.me/Chnk_mn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Restore favicon
        run: |
          mkdir -p dist/images
          git show HEAD:dist/images/favicon.jpg > dist/images/favicon.jpg || true

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages || git checkout --orphan gh-pages
          git reset --hard
          rm -rf assets dist images index.html
          cp -r dist/. .
          rm -rf dist
          git add -A
          git commit -m "deploy: build $(date +%s)" || echo "nothing to commit"
          git push origin gh-pages
