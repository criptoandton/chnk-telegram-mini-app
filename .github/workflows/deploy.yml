name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: chnk-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://htwrjzlrewrxeartslhi.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_BEQbpUhu9Sw6akvVEb5CJQ_SRdmXi1a' }}
      VITE_TG_CHANNEL: ${{ vars.VITE_TG_CHANNEL || 'https://t.me/CHNK_channel' }}
      VITE_TG_BANK: ${{ vars.VITE_TG_BANK || 'https://t.me/Chnkbank' }}
      VITE_TG_SUPPORT: ${{ vars.VITE_TG_SUPPORT || 'https://t.me/Chnk_mn' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Stage build
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/chnk-build"
          mkdir -p "$RUNNER_TEMP/chnk-build"
          cp -r dist/. "$RUNNER_TEMP/chnk-build/"
          mkdir -p "$RUNNER_TEMP/chnk-build/images"
          git show HEAD:dist/images/favicon.jpg > "$RUNNER_TEMP/chnk-build/images/favicon.jpg" 2>/dev/null || true

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/chnk-publish"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          # Fresh repo in an isolated folder: we never touch the checked-out
          # working tree, so a dirty checkout cannot break the publish.
          cd "$PUBLISH_DIR"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -q --orphan gh-pages
          cp -r "$RUNNER_TEMP/chnk-build/." .
          rm -rf .git

          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan gh-pages
          git add -A
          git commit -q -m "deploy: build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force origin gh-pages
          echo "published $(git rev-parse --short HEAD) to gh-pages"
